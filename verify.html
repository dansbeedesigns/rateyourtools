<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — RateYourTools.org</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">
      <img src="/rateyourtools-logo.png" alt="RateYourTools logo">
      <div class="site-logo-text">Rate Your Tools<span>.org</span></div>
    </a>
  </div>
</header>

<div class="verify-page">
  <div class="verify-card">
    <div id="verify-icon" class="verify-icon">
      <span class="spinner" style="width:48px;height:48px;border-width:4px"></span>
    </div>
    <h2 id="verify-title">Verifying…</h2>
    <p id="verify-msg" style="font-size:.9rem;color:var(--cream);margin:0.75rem 0 1.5rem"></p>
    <div id="verify-actions"></div>
  </div>
</div>

<script type="module">
import { Auth, getParam } from '/js/main.js';

const token = getParam('token');

async function verify() {
  const icon    = document.getElementById('verify-icon');
  const title   = document.getElementById('verify-title');
  const msg     = document.getElementById('verify-msg');
  const actions = document.getElementById('verify-actions');

  if (!token) {
    icon.textContent  = '❌';
    title.textContent = 'Invalid Link';
    msg.textContent   = 'No verification token found. Please request a new link.';
    actions.innerHTML = `<a href="/" class="btn btn-outline">Return Home</a>`;
    return;
  }

  try {
    const res = await fetch(`/api/auth/verify?token=${encodeURIComponent(token)}`);
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Verification failed');

    // Save session
    Auth.save(data.session_token, data.email);

    icon.textContent  = '✅';
    title.textContent = 'Email Verified!';
    msg.innerHTML     = `Welcome, <strong style="color:var(--amber)">${data.email}</strong>.<br>
                         You can now rate tools and write reviews.`;
    actions.innerHTML = `
      <a href="/" class="btn btn-primary" style="margin-right:.75rem">Browse Tools</a>
      <a href="/" class="btn btn-outline">Go Home</a>`;

    // Auto-redirect after 3 seconds
    setTimeout(() => location.href = '/', 3000);
  } catch (err) {
    icon.textContent  = '⚠️';
    title.textContent = 'Verification Failed';
    msg.textContent   = err.message + ' The link may have expired — links are valid for 30 minutes.';
    actions.innerHTML = `<a href="/" class="btn btn-outline">Return Home</a>`;
  }
}

verify();
</script>
</body>
</html>
