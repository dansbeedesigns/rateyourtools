<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — RateYourTools.org</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="RateYourTools logo">
        <circle cx="60" cy="60" r="58" fill="#0A2020" stroke="#D4CFC7" stroke-width="4"/>
        <g fill="#D4CFC7" opacity="0.6">
          <polygon points="60,6 64,18 56,18"/><polygon points="60,114 64,102 56,102"/>
          <polygon points="6,60 18,64 18,56"/><polygon points="114,60 102,64 102,56"/>
          <polygon points="18,18 26,28 20,34"/><polygon points="102,18 94,28 100,34"/>
          <polygon points="18,102 26,92 20,86"/><polygon points="102,102 94,92 100,86"/>
          <polygon points="10,38 22,40 19,47"/><polygon points="110,38 98,40 101,47"/>
          <polygon points="10,82 22,80 19,73"/><polygon points="110,82 98,80 101,73"/>
          <polygon points="38,10 40,22 47,19"/><polygon points="82,10 80,22 73,19"/>
          <polygon points="38,110 40,98 47,101"/><polygon points="82,110 80,98 73,101"/>
        </g>
        <circle cx="60" cy="60" r="44" fill="#123030"/>
        <text x="60" y="50" font-family="Arial" font-size="20" fill="#E8913A" text-anchor="middle">★★★★★</text>
        <rect x="36" y="55" width="48" height="3" rx="1.5" fill="#D4CFC7"/>
        <text x="60" y="76" font-family="Arial" font-weight="700" font-size="9.5" fill="#E8913A" text-anchor="middle" letter-spacing="2">RATE YOUR TOOLS</text>
        <text x="60" y="89" font-family="Arial" font-weight="700" font-size="7" fill="#D4CFC7" text-anchor="middle" letter-spacing="1.5">.ORG</text>
      </svg>
      <div class="site-logo-text">Rate Your Tools<span>.org</span></div>
    </a>
  </div>
</header>

<div class="verify-page">
  <div class="verify-card">
    <div id="verify-icon" class="verify-icon">
      <span class="spinner" style="width:48px;height:48px;border-width:4px"></span>
    </div>
    <h2 id="verify-title">Verifying…</h2>
    <p id="verify-msg" style="font-size:.9rem;color:var(--cream);margin:0.75rem 0 1.5rem"></p>
    <div id="verify-actions"></div>
  </div>
</div>

<script type="module">
import { Auth, getParam } from '/js/main.js';

const token = getParam('token');

async function verify() {
  const icon    = document.getElementById('verify-icon');
  const title   = document.getElementById('verify-title');
  const msg     = document.getElementById('verify-msg');
  const actions = document.getElementById('verify-actions');

  if (!token) {
    icon.textContent  = '❌';
    title.textContent = 'Invalid Link';
    msg.textContent   = 'No verification token found. Please request a new link.';
    actions.innerHTML = `<a href="/" class="btn btn-outline">Return Home</a>`;
    return;
  }

  try {
    const res = await fetch(`/api/auth/verify?token=${encodeURIComponent(token)}`);
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || 'Verification failed');

    // Save session
    Auth.save(data.session_token, data.email);

    icon.textContent  = '✅';
    title.textContent = 'Email Verified!';
    msg.innerHTML     = `Welcome, <strong style="color:var(--amber)">${data.email}</strong>.<br>
                         You can now rate tools and write reviews.`;
    actions.innerHTML = `
      <a href="/" class="btn btn-primary" style="margin-right:.75rem">Browse Tools</a>
      <a href="/" class="btn btn-outline">Go Home</a>`;

    // Auto-redirect after 3 seconds
    setTimeout(() => location.href = '/', 3000);
  } catch (err) {
    icon.textContent  = '⚠️';
    title.textContent = 'Verification Failed';
    msg.textContent   = err.message + ' The link may have expired — links are valid for 30 minutes.';
    actions.innerHTML = `<a href="/" class="btn btn-outline">Return Home</a>`;
  }
}

verify();
</script>
</body>
</html>
